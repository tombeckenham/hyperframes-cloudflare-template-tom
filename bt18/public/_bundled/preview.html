<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Cloudflare Intro HyperFrames</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #ffffff;
    }

    #cloudflare-intro {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #ffffff;
      color: #1f1f1f;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    #grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.55;
      background:
        linear-gradient(90deg, transparent calc(100% - 1px), #ead7c2 0) 0 0 / 120px 100%,
        linear-gradient(0deg, transparent calc(100% - 1px), #ead7c2 0) 0 0 / 100% 120px;
    }

    #telemetry {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
      color: #b1672e;
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 18px;
      line-height: 1;
      pointer-events: none;
    }

    #telemetry span {
      position: absolute;
      transform: translate(-50%, -50%);
    }

    #shadow {
      position: absolute;
      left: 50%;
      top: 720px;
      width: 560px;
      height: 1px;
      z-index: 1;
      opacity: 0;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(243, 128, 32, 0.55), transparent);
    }

    #mark-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 1;
      transform-origin: 50% 50%;
      will-change: opacity;
    }

    #cloud-svg {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 720px;
      height: 420px;
      overflow: visible;
      transform: translate(-50%, -50%);
      transform-origin: 50% 50%;
      will-change: transform;
    }

    #cloud-fill { fill: #F38020; }

    #copy-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: end center;
      padding: 0 150px 108px;
      opacity: 0;
      color: #1f1f1f;
      pointer-events: none;
    }

    #copy-layer h1 {
      margin: 0;
      width: 1180px;
      max-width: 100%;
      font-size: 78px;
      line-height: 0.98;
      font-weight: 650;
      letter-spacing: 0;
      text-align: center;
    }

    #copy-layer span {
      display: block;
    }

    #next-beat {
      position: absolute;
      inset: 0;
      z-index: 5;
      opacity: 0;
      color: #1f1f1f;
      perspective: 900px;
      transform-origin: 50% 50%;
      will-change: opacity, transform;
      pointer-events: none;
    }

    #beat-prefix,
    #beat-suffix-wrap {
      position: absolute;
      top: 468px;
      font-size: 96px;
      line-height: 1;
      font-weight: 650;
      letter-spacing: 0;
      white-space: nowrap;
      will-change: transform, opacity, clip-path;
    }

    #beat-prefix {
      left: 250px;
      opacity: 0;
      transform: translateX(-760px);
    }

    #hf-word,
    #beat-now {
      display: inline-block;
      will-change: opacity, transform;
    }

    #beat-symbol {
      position: relative;
      display: inline-block;
      width: 54px;
      height: 110px;
      vertical-align: top;
    }

    #beat-n,
    #beat-plus {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      transform-origin: 50% 50%;
      will-change: opacity, transform;
    }

    #beat-plus {
      left: -26px;
      opacity: 0;
      color: #F38020;
    }

    #beat-rest {
      display: inline-block;
      transform-origin: 0 50%;
      will-change: opacity, transform;
    }

    #hf-word {
      width: 700px;
      height: 144px;
      margin-top: -14px;
      padding-top: 14px;
      padding-left: 48px;
      margin-left: -48px;
      margin-right: 8px;
      overflow: hidden;
      perspective: 900px;
      transform-style: preserve-3d;
      vertical-align: top;
    }

    #hf-word-face,
    #beat-cloudflare {
      display: block;
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
      will-change: opacity, transform;
    }

    #beat-suffix-wrap {
      left: 1410px;
      top: 454px;
      height: 144px;
      padding: 14px 0 0;
      overflow: hidden;
      perspective: 900px;
      transform-style: preserve-3d;
      clip-path: inset(100% 0 0 0);
    }

    #beat-cloudflare {
      transform: translateY(0);
    }

    .app-icon {
      position: absolute;
      top: 409px;
      width: 172px;
      height: 172px;
      opacity: 0;
      border-radius: 36px;
      object-fit: cover;
      box-shadow: 0 22px 54px rgba(180, 92, 24, 0.22);
      transform-origin: 50% 50%;
      transform-style: preserve-3d;
      will-change: opacity, transform;
    }

    #hf-icon {
      left: 382px;
    }

    #cf-icon {
      left: 1184px;
      background: #ffffff;
    }

    #label {
      position: absolute;
      left: 34px;
      bottom: 30px;
      z-index: 8;
      display: none;
      color: rgba(31, 31, 31, 0.58);
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 16px;
      line-height: 1;
      text-transform: uppercase;
    }
  </style>

  }, ROLL_DURATION);
  tl.to(state, {
    scale: 0.6,
    x: 0,
    y: 0,
    rotation: 0,
    shadowOpacity: 0,
    telemetryOpacity: 0,
    duration: SNAP_DURATION,
    ease: "power2.in",
    onUpdate: () => {
      state.label = "cloud snap";
    }
  }, ROLL_DURATION + HOLD_DURATION);
  tl.set(state, {
    x: 0,
    y: 0,
    scale: 1,
    rotation: 0,
    markOpacity: 1,
    beatOpacity: 0,
    beatBlur: 0,
    beatCameraX: 0,
    beatCameraY: 0,
    beatCameraScale: 1,
    prefixX: -760,
    prefixOpacity: 0,
    hfWordOpacity: 1,
    hfWordRoll: 0,
    nowX: 0,
    nowRestOpacity: 1,
    nowRestScale: 1,
    nOpacity: 1,
    nY: 0,
    nScale: 1,
    nRotation: 0,
    plusY: -25,
    plusOpacity: 0,
    plusScale: 0.4,
    plusRotation: -90,
    suffixOpacity: 1,
    suffixMask: 100,
    suffixRoll: 0,
    suffixY: 0,
    hfIconOpacity: 0,
    hfIconX: 0,
    hfIconScale: 0.82,
    hfIconRoll: -88,
    hfIconZ: -120,
    cfIconOpacity: 0,
    cfIconX: 0,
    cfIconScale: 0.82,
    cfIconRoll: 88,
    cfIconZ: -120,
    label: "next beat setup"
  }, NEXT_BEAT_START);
  tl.call(() => {
    beatDriver.ms = 0;
    seekBeat(0);
  }, [], NEXT_BEAT_START);
  tl.to(beatDriver, {
    ms: NEXT_BEAT_DURATION * 1e3,
    duration: NEXT_BEAT_DURATION,
    ease: "none",
    onUpdate: () => {
      seekBeat(beatDriver.ms);
    },
    onComplete: () => {
      seekBeat(NEXT_BEAT_DURATION * 1e3);
    }
  }, NEXT_BEAT_START);
  tl.to(state, {
    duration: FINAL_HOLD,
    ease: "none",
    onUpdate: () => {
      state.label = "final lockup hold";
    }
  }, NEXT_BEAT_START + NEXT_BEAT_DURATION);
  renderDom();
  window.__timelines["cloudflare-intro"] = tl;
})();</script></body>
